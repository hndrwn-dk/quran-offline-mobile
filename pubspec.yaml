name: quran_offline
description: Quran Offline is a simple, fast, and distraction-free Qur’an reading app designed for all ages
publish_to: 'none'
version: 1.0.16+57

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Database
  drift: ^2.14.1
  sqlite3: 2.9.4
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # JSON & Async
  json_annotation: ^4.8.1
  
  # Share
  share_plus: ^12.0.2
  
  # URL Launcher
  url_launcher: ^6.2.5
  
  # Utilities
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  
  # Scroll to item
  scrollable_positioned_list: ^0.3.8

  # Audio recitation
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.3
  http: ^1.6.0
  crypto: ^3.0.3
  hijri: ^3.0.1
  sqflite: ^2.4.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.9.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/quran/
    - assets/quran/surah_names/
    - assets/fonts/
    # Launcher masters and Android 12 splash masters stay on disk for tooling
    # and are not bundled. In-app splash logos are bundled below.
    - assets/icon/explore/
    - assets/icon/splash_logo_green.png
    - assets/icon/splash_logo_cream.png
    - assets/duas/duas_catalog.json
    - assets/ai/quran_dua_ayat_catalog.json
    - assets/ai/search_index.sqlite
    - assets/ai/synonyms_id.json
    - assets/science/science_catalog.json
    - assets/themes/life_themes_catalog.json
    - assets/reflection/calendar_lenses_catalog.json
    - assets/reflection/weekly_rotation_catalog.json
    - assets/asma/
    - assets/quran/surah_info/en_surah_info.sqlite
    - assets/quran/surah_info/id_surah_info.sqlite
    - assets/quran/transliteration/transliteration-tajweed.db
    - assets/tafsir/id_as_saadi.sqlite
    - assets/tafsir/en_ibn_kathir.sqlite
    - assets/tafsir/zh_mokhtasar.sqlite
    - assets/tafsir/ja_mokhtasar.sqlite
    - assets/mushaf/layout/qpc_v2_15_lines.sqlite
    - assets/mushaf/script/qpc_v2_words.sqlite
    - assets/fonts/qpc_v2/
  
  fonts:
    - family: DigitalKhattV2
      fonts:
        - asset: assets/fonts/DigitalKhattV2.otf
    - family: UthmanicHafsV22
      fonts:
        - asset: assets/fonts/uthmanic_hafs_v22.ttf
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/uthmanic_hafs_v22.ttf
    - family: KFGQPCUthmanic
      fonts:
        - asset: assets/fonts/KFGQPC Uthmanic Script HAFS Regular.otf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: SurahNameV2
      fonts:
        - asset: assets/fonts/surah_name_v2.ttf

flutter_native_splash:
  color: "#F7FBF2"
  image: assets/icon/splash_logo_green.png
  color_dark: "#10140F"
  image_dark: assets/icon/splash_logo_cream.png
  android_12:
    color: "#F7FBF2"
    image: assets/icon/splash12_green.png
    color_dark: "#10140F"
    image_dark: assets/icon/splash12_cream.png
  android: true
  ios: false
  web: false
  fullscreen: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full_1024.png"
  adaptive_icon_background: "#EDF1D9"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  min_sdk_android: 24

