include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - tmp/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Dead dev snapshot tool: still uses MushafSpineStyle / MushafSpreadRow,
    # removed in #20. Its analyzer errors made release analyze fail.
    - tools/mushaf_spread_snapshot_test.dart

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    prefer_single_quotes: true

